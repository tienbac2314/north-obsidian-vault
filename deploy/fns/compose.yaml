services:
  fast-note-sync:
    image: haierkeys/fast-note-sync-service:3.6.0@sha256:560ab727f2a0bac804a6db9e467b68d7df1a1cf059e72dfccc0412aa4c62e89e
    restart: unless-stopped
    ports:
      - "[::1]:${FNS_HOST_PORT:-19000}:9000"
    volumes:
      - ./runtime/config:/fast-note-sync/config
      - ./runtime/storage:/fast-note-sync/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:9000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
