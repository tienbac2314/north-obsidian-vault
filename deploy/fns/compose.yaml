services:
  fast-note-sync:
    image: haierkeys/fast-note-sync-service:3.6.1@sha256:15833f15e83cee05794c3fe6028c7e41fd36c787f0d651415cad556579fc379f
    restart: unless-stopped
    ports:
      - "[::1]:${FNS_HOST_PORT:-19000}:9000"
    volumes:
      - ./runtime/config:/fast-note-sync/config
      - ./runtime/storage:/fast-note-sync/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:9000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
